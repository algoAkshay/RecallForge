services:
  - type: web
    name: recallforge
    runtime: python
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python -m streamlit run src/main.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    envVars:
      - key: RECALLFORGE_STORAGE_DIR
        value: /var/data
    disk:
      name: recallforge-data
      mountPath: /var/data
      sizeGB: 1
